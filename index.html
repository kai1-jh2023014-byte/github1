<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>詳細時間割アプリ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>詳細時間割アプリ</h1>

      <section class="card">
        <h2>予定追加</h2>
        <form id="schedule-form">
          <label>
            曜日
            <select id="day" required>
              <option value="1">月</option>
              <option value="2">火</option>
              <option value="3">水</option>
              <option value="4">木</option>
              <option value="5">金</option>
              <option value="6">土</option>
              <option value="0">日</option>
            </select>
          </label>
          <label>
            時限
            <input id="period" type="number" min="1" max="8" required />
          </label>
          <label>
            科目
            <input id="subject" type="text" required />
          </label>
          <label>
            課題
            <input id="task" type="text" placeholder="例: ワークp10" />
          </label>
          <label>
            必要なもの（カンマ区切り）
            <input id="items" type="text" placeholder="例: 教科書, ノート, 筆記用具" />
          </label>
          <button type="submit">追加</button>
        </form>
      </section>

      <section class="card">
        <div class="view-switcher">
          <button id="table-view-btn" class="active" type="button">表形式</button>
          <button id="calendar-view-btn" type="button">カレンダー形式</button>
        </div>
        <div id="table-view"></div>
        <div id="calendar-view" class="hidden"></div>
      </section>

      <section class="card">
        <h2>忘れ物チェック（今日）</h2>
        <label>
          持っているもの（カンマ区切り）
          <input id="packed-items" type="text" placeholder="例: 教科書, 筆記用具" />
        </label>
        <button id="check-items-btn" type="button">忘れ物がないか確認</button>
        <p id="reminder-message" aria-live="polite"></p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
